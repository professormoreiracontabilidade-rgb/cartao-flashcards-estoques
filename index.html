<head>
<meta charset="UTF-8">

<title>Flashcards - CPC 16 (R1) – Estoques</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
body{background:#eef3f8;min-height:100vh;padding:14px;color:#111;}
.container{width:100%;max-width:760px;margin:0 auto;}
.topo{background:#003b8f;color:white;padding:18px;border-radius:20px;text-align:center;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.18);}
.topo h1{font-size:30px;letter-spacing:.5px;text-transform:uppercase;}
.topo p{font-size:18px;margin-top:6px;font-weight:bold;color:#eaf2ff;}
.card-area{perspective:1200px;width:100%;}
.card{width:100%;min-height:330px;height:52vh;max-height:470px;position:relative;transform-style:preserve-3d;transition:transform .65s ease;cursor:pointer;}
.card.virado{transform:rotateY(180deg);}
.face{position:absolute;inset:0;border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;box-shadow:0 8px 22px rgba(0,0,0,.18);border:3px solid rgba(0,59,143,.18);overflow-y:auto;}
.frente{background:#b3e5fc;color:#000;}
.verso{background:#f8bbd0;color:#000;transform:rotateY(180deg);}
.rotulo{font-size:15px;font-weight:900;color:#003b8f;margin-bottom:14px;text-transform:uppercase;}
.texto{font-size:24px;line-height:1.32;font-weight:800;}
.verso .texto{font-size:21px;text-align:left;width:100%;font-weight:700;}
.bloco{background:rgba(255,255,255,.45);border-radius:14px;padding:12px;margin-top:10px;width:100%;}
.toque{margin-top:14px;font-size:14px;color:#003b8f;font-weight:bold;}
.indice{text-align:center;margin:14px 0 0;font-size:18px;color:#003b8f;font-weight:900;}
.barra-bg{height:12px;background:#d8e7f8;border-radius:30px;overflow:hidden;margin-top:10px;}
.barra{height:100%;width:0%;background:#003b8f;transition:.3s;}
.controles{display:flex;gap:10px;margin-top:16px;}
button{flex:1;border:none;border-radius:16px;padding:15px 8px;background:#003b8f;color:white;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.18);}
button:active{transform:scale(.98);}
.rodape{text-align:center;margin-top:18px;color:#003b8f;font-size:14px;font-weight:bold;}
@media(max-width:430px){.topo h1{font-size:25px}.topo p{font-size:16px}.card{height:50vh;min-height:330px}.texto{font-size:21px}.verso .texto{font-size:18px}button{font-size:16px;padding:14px 6px}}
</style>
</head>
<body>
<div class="container">
  <div class="topo">
    <h1>📚 FLASHCARDS</h1>
    <p>CPC 16 (R1) – Estoques</p>
  </div>

  <div class="card-area">
    <div class="card" id="card" onclick="virarCard()">
      <div class="face frente">
        <div class="rotulo">Pergunta</div>
        <div class="texto" id="pergunta"></div>
        <div class="toque">Toque no cartão para virar 🔄</div>
      </div>
      <div class="face verso">
        <div class="rotulo">Resposta comentada</div>
        <div class="texto" id="resposta"></div>
        <div class="toque">Toque novamente para voltar 📚</div>
      </div>
    </div>
  </div>

  <div class="indice" id="contador"></div>
  <div class="barra-bg"><div class="barra" id="barra"></div></div>

  <div class="controles">
    <button onclick="event.stopPropagation(); anterior();">⬅️ Voltar</button>
    <button onclick="event.stopPropagation(); reiniciar();">🔄 Reiniciar</button>
    <button onclick="event.stopPropagation(); proximo();">Avançar ➡️</button>
  </div>

  <div class="rodape">Curso de Contabilidade Professor Moreira</div>
</div>

<script>
const flashcards = [{"pergunta": "O que são estoques segundo o CPC 16?", "resposta": "São ativos mantidos para venda, em processo de produção para venda ou na forma de materiais e suprimentos a serem consumidos.", "explicacao": "O CPC 16 trata estoques como ativos ligados ao ciclo operacional da entidade.", "dica": "🎯 Decore: venda, produção ou consumo no processo produtivo.", "pegadinha": "⚠️ Não confunda estoque com imobilizado usado pela empresa."}, {"pergunta": "Qual é a regra geral de mensuração dos estoques?", "resposta": "Menor valor entre o custo e o valor realizável líquido.", "explicacao": "A entidade compara o custo registrado com o valor que espera realizar na venda líquida.", "dica": "🎯 Regra de ouro: menor entre custo e VRL.", "pegadinha": "⚠️ A banca adora trocar por “maior valor”."}, {"pergunta": "O que é valor realizável líquido?", "resposta": "Preço de venda estimado menos os custos estimados para conclusão e os gastos necessários para realizar a venda.", "explicacao": "É o valor líquido que a entidade espera receber no curso normal dos negócios.", "dica": "🎯 Fórmula: VRL = preço de venda – custos para concluir – despesas de venda.", "pegadinha": "⚠️ Não é simplesmente valor de mercado bruto."}, {"pergunta": "Tributos recuperáveis integram o custo dos estoques?", "resposta": "Não. Tributos recuperáveis são registrados como créditos tributários, não como custo do estoque.", "explicacao": "ICMS recuperável, por exemplo, não deve aumentar o custo da mercadoria.", "dica": "🎯 Recuperável = ativo tributário, não estoque.", "pegadinha": "⚠️ Tributo recuperável não entra no custo."}, {"pergunta": "Tributos não recuperáveis integram o custo dos estoques?", "resposta": "Sim. Tributos não recuperáveis compõem o custo de aquisição.", "explicacao": "Quando a entidade não pode compensar o tributo, ele representa sacrifício necessário para adquirir o estoque.", "dica": "🎯 Não recuperável = entra no custo.", "pegadinha": "⚠️ A banca mistura recuperável com não recuperável."}, {"pergunta": "Frete sobre compra pode integrar o custo dos estoques?", "resposta": "Sim, quando for necessário para colocar o estoque no local e condição atuais.", "explicacao": "Fretes, seguros e manuseio diretamente atribuíveis à aquisição podem compor o custo.", "dica": "🎯 Frete de compra, em regra, ativa no estoque.", "pegadinha": "⚠️ Frete sobre venda é despesa, não estoque."}, {"pergunta": "Frete sobre venda integra o custo do estoque?", "resposta": "Não. Frete sobre venda normalmente é despesa de venda.", "explicacao": "Ele ocorre depois que o estoque já está pronto para venda e está relacionado à entrega ao cliente.", "dica": "🎯 Compra ativa; venda despesa.", "pegadinha": "⚠️ Pegadinha clássica em concursos."}, {"pergunta": "Desconto comercial reduz o custo dos estoques?", "resposta": "Sim. Descontos comerciais, abatimentos e itens semelhantes reduzem o custo de aquisição.", "explicacao": "Como o desconto ocorre na negociação da compra, o custo inicial já deve ser líquido.", "dica": "🎯 Desconto comercial reduz estoque.", "pegadinha": "⚠️ Diferencie de desconto financeiro."}, {"pergunta": "Desconto financeiro reduz o custo do estoque?", "resposta": "Não. Desconto financeiro é receita financeira e não altera o custo do estoque.", "explicacao": "O desconto por pagamento antecipado decorre da forma de liquidação da dívida.", "dica": "🎯 Desconto financeiro vai ao resultado financeiro.", "pegadinha": "⚠️ Não confunda com desconto comercial."}, {"pergunta": "O custo dos estoques inclui custos de aquisição e transformação?", "resposta": "Sim. Também inclui outros custos necessários para colocar os estoques em sua condição e localização atuais.", "explicacao": "O CPC 16 agrupa o custo em aquisição, transformação e outros custos diretamente necessários.", "dica": "🎯 Três blocos: aquisição, transformação e outros necessários.", "pegadinha": "⚠️ Nem todo gasto vira estoque."}, {"pergunta": "Desperdícios anormais entram no custo dos estoques?", "resposta": "Não. Devem ser reconhecidos como despesa do período.", "explicacao": "Desperdícios anormais não agregam benefício econômico ao estoque.", "dica": "🎯 Anormal = despesa.", "pegadinha": "⚠️ A banca tenta ativar desperdício anormal."}, {"pergunta": "Despesas administrativas geralmente integram o custo dos estoques?", "resposta": "Não, salvo se contribuírem diretamente para colocar o estoque em condição e localização atuais.", "explicacao": "Administração geral normalmente não é custo de estoque.", "dica": "🎯 Administração geral = despesa.", "pegadinha": "⚠️ Só entra se for diretamente atribuível."}, {"pergunta": "Despesas de venda integram o custo dos estoques?", "resposta": "Não. Despesas de venda são reconhecidas no resultado.", "explicacao": "Elas não são necessárias para trazer o estoque à condição e localização atuais.", "dica": "🎯 Venda é depois do estoque pronto.", "pegadinha": "⚠️ Despesa de venda não ativa no estoque."}, {"pergunta": "O PEPS é aceito pelo CPC 16?", "resposta": "Sim. O método Primeiro que Entra, Primeiro que Sai é aceito.", "explicacao": "No PEPS, os itens mais antigos são considerados vendidos primeiro.", "dica": "🎯 PEPS aceito.", "pegadinha": "⚠️ Estoque final fica com custos mais recentes."}, {"pergunta": "O custo médio ponderado é aceito pelo CPC 16?", "resposta": "Sim. O CPC 16 permite o custo médio ponderado.", "explicacao": "O custo dos itens é determinado pela média ponderada dos custos existentes e das entradas.", "dica": "🎯 Média ponderada é aceita.", "pegadinha": "⚠️ Pode ser periódica ou móvel."}, {"pergunta": "O UEPS é aceito pelo CPC 16?", "resposta": "Não. O UEPS não é aceito pelas normas internacionais adotadas pelo CPC.", "explicacao": "O CPC 16 permite PEPS e custo médio, mas não o último que entra, primeiro que sai.", "dica": "🎯 UEPS proibido.", "pegadinha": "⚠️ Questão campeã de prova."}, {"pergunta": "Quando se usa identificação específica?", "resposta": "Quando os itens não são normalmente intercambiáveis ou são segregados para projetos específicos.", "explicacao": "Exemplos: veículos específicos, joias exclusivas e bens personalizados.", "dica": "🎯 Item individualizado = identificação específica.", "pegadinha": "⚠️ Não usar identificação específica para estoque comum em massa."}, {"pergunta": "O método do varejo pode ser utilizado?", "resposta": "Sim, quando aproxima o custo, especialmente em varejo com grande quantidade de itens e margens semelhantes.", "explicacao": "O custo é estimado pela redução do preço de venda pela margem bruta apropriada.", "dica": "🎯 Método do varejo é técnica de mensuração.", "pegadinha": "⚠️ Não é método livre sem aproximação razoável."}, {"pergunta": "Perda por redução ao valor realizável líquido afeta o resultado?", "resposta": "Sim. A perda é reconhecida como despesa no resultado.", "explicacao": "Quando o VRL fica menor que o custo, o estoque deve ser reduzido.", "dica": "🎯 Custo maior que VRL = perda.", "pegadinha": "⚠️ Não deixe o estoque acima do que será recuperado."}, {"pergunta": "A perda por redução ao VRL pode ser revertida?", "resposta": "Sim, quando deixarem de existir as circunstâncias que causaram a redução.", "explicacao": "A reversão é limitada ao valor da perda anteriormente reconhecida.", "dica": "🎯 Melhorou o VRL? Pode reverter dentro do limite.", "pegadinha": "⚠️ Não pode aumentar acima do custo original."}, {"pergunta": "Quando o estoque vendido vira despesa?", "resposta": "Quando a respectiva receita é reconhecida, o valor contábil do estoque deve ser reconhecido como despesa.", "explicacao": "Essa despesa normalmente é o CMV ou custo dos produtos vendidos.", "dica": "🎯 Venda reconhecida = baixa do estoque para resultado.", "pegadinha": "⚠️ Não mantenha no ativo item já vendido."}, {"pergunta": "Qual lançamento básico da baixa de mercadoria vendida?", "resposta": "Débito em CMV e crédito em Estoques/Mercadorias.", "explicacao": "O estoque sai do ativo e passa para o resultado como custo.", "dica": "🎯 D: CMV / C: Estoques.", "pegadinha": "⚠️ A receita da venda é lançamento separado."}, {"pergunta": "Juros embutidos em compra a prazo integram o estoque?", "resposta": "Não, quando há elemento de financiamento relevante. A diferença é despesa financeira ao longo do tempo.", "explicacao": "O estoque deve ser reconhecido pelo preço equivalente à vista, quando aplicável.", "dica": "🎯 AVP: estoque pelo valor à vista; juros no resultado financeiro.", "pegadinha": "⚠️ Não coloque financiamento dentro do estoque."}, {"pergunta": "Seguro sobre compra pode integrar o estoque?", "resposta": "Sim, se for necessário para trazer o item até o local e condição atuais.", "explicacao": "Seguro de transporte da compra é gasto diretamente atribuível à aquisição.", "dica": "🎯 Seguro na compra pode ativar.", "pegadinha": "⚠️ Seguro administrativo geral não entra."}, {"pergunta": "Materiais de consumo usados na produção podem ser estoques?", "resposta": "Sim. Materiais e suprimentos a serem consumidos na produção são estoques.", "explicacao": "O CPC 16 inclui materiais que serão consumidos no processo produtivo ou na prestação de serviços.", "dica": "🎯 Matéria-prima também é estoque.", "pegadinha": "⚠️ Estoque não é só mercadoria pronta."}, {"pergunta": "Produtos em elaboração são estoques?", "resposta": "Sim. Produtos em processo de produção para venda são estoques.", "explicacao": "Na indústria, os estoques incluem matéria-prima, produtos em elaboração e produtos acabados.", "dica": "🎯 Em elaboração = estoque.", "pegadinha": "⚠️ Não confunda com despesa em andamento sem ativo."}, {"pergunta": "Produtos acabados são estoques?", "resposta": "Sim. Produtos acabados destinados à venda são estoques.", "explicacao": "Eles permanecem no ativo até a venda ou baixa.", "dica": "🎯 Acabado para venda = estoque.", "pegadinha": "⚠️ Se for usado pela empresa, pode ser imobilizado."}, {"pergunta": "Mercadorias para revenda são estoques?", "resposta": "Sim. São bens adquiridos e mantidos para venda no curso normal dos negócios.", "explicacao": "É o caso típico de empresas comerciais.", "dica": "🎯 Comércio: mercadorias = estoque.", "pegadinha": "⚠️ Mercadoria comprada para uso próprio não é estoque de revenda."}, {"pergunta": "Ociosidade anormal deve ser incluída no custo dos estoques?", "resposta": "Não. O custo fixo não alocado por ociosidade anormal deve ser despesa.", "explicacao": "Custos fixos são alocados com base na capacidade normal de produção.", "dica": "🎯 Ociosidade anormal = resultado.", "pegadinha": "⚠️ Não superavalie o estoque em períodos de baixa produção."}, {"pergunta": "Custos indiretos fixos são alocados com base em quê?", "resposta": "Com base na capacidade normal de produção.", "explicacao": "A capacidade normal representa a produção média esperada em condições normais.", "dica": "🎯 CIF fixo usa capacidade normal.", "pegadinha": "⚠️ Produção baixa não aumenta custo unitário indefinidamente."}, {"pergunta": "Custos indiretos variáveis são alocados como?", "resposta": "Com base no uso real das instalações de produção.", "explicacao": "Eles variam diretamente ou quase diretamente com o volume produzido.", "dica": "🎯 CIF variável acompanha produção real.", "pegadinha": "⚠️ Diferencie fixo e variável."}, {"pergunta": "Custo de transformação inclui mão de obra direta?", "resposta": "Sim. Inclui custos diretamente relacionados às unidades produzidas, como mão de obra direta.", "explicacao": "Também inclui alocação sistemática dos custos indiretos de produção.", "dica": "🎯 Transformação = MOD + CIF.", "pegadinha": "⚠️ Não inclua venda e administração geral."}, {"pergunta": "Custo de aquisição inclui preço de compra?", "resposta": "Sim. O preço de compra é componente básico do custo de aquisição.", "explicacao": "Depois são feitos ajustes como tributos não recuperáveis, fretes e dedução de descontos comerciais.", "dica": "🎯 Preço de compra é ponto de partida.", "pegadinha": "⚠️ Preço bruto pode precisar de ajustes."}, {"pergunta": "Abatimentos reduzem o custo dos estoques?", "resposta": "Sim. Abatimentos e descontos comerciais reduzem o custo de aquisição.", "explicacao": "Eles diminuem o sacrifício econômico necessário para adquirir o item.", "dica": "🎯 Abatimento na compra reduz estoque.", "pegadinha": "⚠️ Não trate como receita operacional."}, {"pergunta": "Armazenagem sempre entra no custo do estoque?", "resposta": "Não. Só entra quando necessária ao processo produtivo antes de etapa adicional de produção.", "explicacao": "Armazenagem comum após o produto estar pronto geralmente é despesa.", "dica": "🎯 Armazenagem necessária ao processo pode entrar.", "pegadinha": "⚠️ Armazenagem depois de pronto geralmente não entra."}, {"pergunta": "Estoque pode ser reconhecido acima do valor recuperável?", "resposta": "Não. Deve ser ajustado ao valor realizável líquido quando este for menor que o custo.", "explicacao": "A prudência impede manter estoque por valor superior ao que se espera recuperar.", "dica": "🎯 Não carregar estoque irrecuperável.", "pegadinha": "⚠️ Custo histórico não é absoluto."}, {"pergunta": "CPC 16 trata de ativo biológico relacionado à atividade agrícola?", "resposta": "Não. Ativos biológicos são tratados por norma específica, como CPC 29.", "explicacao": "O CPC 16 não se aplica a determinados itens que possuem normas próprias.", "dica": "🎯 Ativo biológico: CPC 29.", "pegadinha": "⚠️ Produto agrícola após colheita pode entrar no CPC 16."}, {"pergunta": "Produto agrícola colhido pode ser tratado como estoque?", "resposta": "Sim, após a colheita, o produto agrícola passa a ser tratado como estoque conforme aplicável.", "explicacao": "Antes da colheita, o ativo biológico segue norma específica.", "dica": "🎯 Após colheita, olhar CPC 16.", "pegadinha": "⚠️ Antes da colheita não é CPC 16."}, {"pergunta": "Serviços em andamento podem gerar estoques?", "resposta": "Sim, para prestadores de serviços, custos de serviços ainda não reconhecidos como receita podem ser estoques.", "explicacao": "Enquanto a receita correspondente não é reconhecida, certos custos podem permanecer como ativo.", "dica": "🎯 Serviço também pode ter estoque.", "pegadinha": "⚠️ Não pense apenas em mercadorias físicas."}, {"pergunta": "O VRL é específico da entidade?", "resposta": "Sim. O valor realizável líquido é baseado no valor que a entidade espera realizar no curso normal dos negócios.", "explicacao": "Ele considera preço estimado, custos de conclusão e venda da própria entidade.", "dica": "🎯 VRL é valor líquido esperado pela entidade.", "pegadinha": "⚠️ Não confunda com valor justo obrigatoriamente."}, {"pergunta": "Valor justo e valor realizável líquido são sempre iguais?", "resposta": "Não. Valor justo é conceito de mercado; VRL é valor líquido esperado na venda normal pela entidade.", "explicacao": "Podem coincidir, mas não são sinônimos.", "dica": "🎯 VRL ≠ valor justo necessariamente.", "pegadinha": "⚠️ Pegadinha conceitual frequente."}, {"pergunta": "A estimativa do VRL considera eventos posteriores?", "resposta": "Pode considerar eventos posteriores que confirmem condições existentes ao fim do período.", "explicacao": "A mensuração deve refletir a melhor estimativa disponível.", "dica": "🎯 Use evidências relacionadas à condição na data-base.", "pegadinha": "⚠️ Não use evento totalmente novo para distorcer a data-base."}, {"pergunta": "Matéria-prima deve ser reduzida ao VRL quando o produto acabado será vendido com lucro?", "resposta": "Em regra, não. Materiais não são reduzidos abaixo do custo se o produto final for vendido pelo custo ou acima dele.", "explicacao": "A análise considera a recuperação por meio do produto final.", "dica": "🎯 Matéria-prima olha a recuperação no produto final.", "pegadinha": "⚠️ Não reduza automaticamente toda matéria-prima."}, {"pergunta": "Se o custo da matéria-prima aumentar, isso significa perda de estoque?", "resposta": "Não necessariamente. A perda depende da comparação entre custo e valor realizável líquido.", "explicacao": "Aumento de preço de reposição pode até indicar que o estoque antigo está recuperável.", "dica": "🎯 Sempre compare custo e VRL.", "pegadinha": "⚠️ Não use reposição isoladamente como perda."}, {"pergunta": "Itens de estoque danificados podem exigir redução ao VRL?", "resposta": "Sim. Danos, obsolescência ou queda de preço podem indicar redução ao valor realizável líquido.", "explicacao": "O estoque deve representar valor recuperável.", "dica": "🎯 Danificado ou obsoleto: atenção ao VRL.", "pegadinha": "⚠️ Não mantenha item sem recuperação pelo custo."}, {"pergunta": "Obsolescência pode gerar baixa ou perda?", "resposta": "Sim. Se reduzir ou eliminar a capacidade de venda, pode exigir ajuste ou baixa.", "explicacao": "O ativo precisa gerar benefício econômico futuro.", "dica": "🎯 Obsoleto = revisar recuperabilidade.", "pegadinha": "⚠️ Obsolescência não pode ser ignorada."}, {"pergunta": "O custo padrão pode ser utilizado?", "resposta": "Sim, se os resultados se aproximarem do custo real.", "explicacao": "Custo padrão é técnica de mensuração aceita quando revisado regularmente.", "dica": "🎯 Custo padrão pode, desde que aproxime o real.", "pegadinha": "⚠️ Padrão desatualizado não serve."}, {"pergunta": "A venda de estoque reconhece receita e baixa de custo?", "resposta": "Sim. A receita é reconhecida conforme norma própria e o estoque é baixado como despesa.", "explicacao": "A baixa gera CMV ou custo dos produtos/serviços vendidos.", "dica": "🎯 Venda tem dois efeitos: receita e custo.", "pegadinha": "⚠️ Não confunda lançamento de venda com lançamento do CMV."}, {"pergunta": "CMV é conta patrimonial?", "resposta": "Não. CMV é conta de resultado, uma despesa/custo reconhecido quando ocorre a venda.", "explicacao": "A conta patrimonial é Estoques/Mercadorias.", "dica": "🎯 CMV fica no resultado.", "pegadinha": "⚠️ Estoque é ativo; CMV é resultado."}, {"pergunta": "Estoque é ativo circulante em regra?", "resposta": "Sim, normalmente é ativo circulante, pois será realizado no ciclo operacional.", "explicacao": "Mesmo que o ciclo operacional ultrapasse 12 meses, pode continuar circulante se realizado no ciclo normal.", "dica": "🎯 Estoque acompanha o ciclo operacional.", "pegadinha": "⚠️ Não use apenas 12 meses quando há ciclo operacional maior."}, {"pergunta": "Ciclo operacional não identificável presume quantos meses?", "resposta": "Presume-se duração de 12 meses.", "explicacao": "Essa regra auxilia na classificação entre circulante e não circulante.", "dica": "🎯 Ciclo não claro = 12 meses.", "pegadinha": "⚠️ Muito cobrado em contabilidade geral."}, {"pergunta": "Compra de mercadoria a prazo gera estoque e fornecedores?", "resposta": "Sim. Débito em estoque e crédito em fornecedores, pelo valor apropriado.", "explicacao": "Se houver tributos recuperáveis ou AVP, o valor do estoque deve ser ajustado.", "dica": "🎯 D: Estoques / C: Fornecedores.", "pegadinha": "⚠️ Verifique impostos recuperáveis e juros."}, {"pergunta": "Compra de mercadoria à vista reduz caixa e aumenta estoque?", "resposta": "Sim, desde que seja mercadoria para revenda ou item classificável como estoque.", "explicacao": "É uma troca entre ativos: sai caixa e entra estoque.", "dica": "🎯 Compra à vista: ativo por ativo.", "pegadinha": "⚠️ Não há despesa no momento da compra, em regra."}, {"pergunta": "A compra de estoque é despesa imediata?", "resposta": "Não. Em regra, é ativo até a venda, consumo ou perda.", "explicacao": "A despesa surge quando o estoque é vendido, consumido ou perde valor.", "dica": "🎯 Compra ativa; venda baixa para CMV.", "pegadinha": "⚠️ Muitos alunos erram classificando como despesa imediata."}, {"pergunta": "O estoque pode ser avaliado apenas pelo preço de venda?", "resposta": "Não. A regra é menor entre custo e valor realizável líquido.", "explicacao": "Preço de venda sozinho não considera custos de conclusão e venda.", "dica": "🎯 Use VRL, não preço bruto.", "pegadinha": "⚠️ Preço de venda não é VRL."}, {"pergunta": "Custos de conclusão entram no cálculo do VRL?", "resposta": "Sim. Devem ser deduzidos do preço de venda estimado.", "explicacao": "Se o produto ainda precisa ser terminado, esses gastos reduzem o valor líquido realizável.", "dica": "🎯 VRL deduz conclusão e venda.", "pegadinha": "⚠️ Não esqueça custos para concluir."}, {"pergunta": "Gastos necessários para vender entram no cálculo do VRL?", "resposta": "Sim. São deduzidos do preço de venda estimado.", "explicacao": "Comissões e despesas necessárias à venda reduzem o valor líquido esperado.", "dica": "🎯 Venda estimada menos gastos de venda.", "pegadinha": "⚠️ VRL não é venda bruta."}, {"pergunta": "Uma perda de estoque aumenta o ativo?", "resposta": "Não. Perda reduz o ativo e reconhece despesa.", "explicacao": "A redução ao VRL ou baixa diminui o valor contábil do estoque.", "dica": "🎯 Perda: despesa e redução do ativo.", "pegadinha": "⚠️ Perda não gera receita."}, {"pergunta": "Conta redutora de estoque possui natureza credora?", "resposta": "Sim. Perdas estimadas para redução ao VRL reduzem o ativo e têm natureza credora.", "explicacao": "É semelhante a outras contas retificadoras do ativo.", "dica": "🎯 Redutora de ativo = natureza credora.", "pegadinha": "⚠️ Embora apareça no ativo, seu saldo é credor."}, {"pergunta": "O CPC 16 permite livre escolha de qualquer critério de estoque?", "resposta": "Não. A entidade deve usar critérios aceitos e consistentes para itens de natureza semelhante.", "explicacao": "Critérios diferentes só fazem sentido para estoques com natureza ou uso diferentes.", "dica": "🎯 Consistência é essencial.", "pegadinha": "⚠️ Não escolha método para manipular resultado."}, {"pergunta": "Itens semelhantes devem usar o mesmo critério de custeio?", "resposta": "Sim, estoques de natureza e uso semelhantes devem receber o mesmo critério.", "explicacao": "Isso preserva comparabilidade e consistência.", "dica": "🎯 Mesma natureza e uso = mesmo método.", "pegadinha": "⚠️ A troca arbitrária de método é vedada."}, {"pergunta": "A entidade pode estimar custos pelo método do varejo sem controle individual detalhado?", "resposta": "Sim, quando a técnica se aproxima do custo e é adequada ao tipo de estoque.", "explicacao": "Muito usada em varejo com grande volume de itens e margens semelhantes.", "dica": "🎯 Varejo: preço de venda menos margem.", "pegadinha": "⚠️ A aproximação precisa ser razoável."}, {"pergunta": "PEPS significa que o estoque final tende a refletir compras recentes?", "resposta": "Sim. Como as primeiras entradas são baixadas primeiro, sobram os itens mais recentes.", "explicacao": "Esse é o raciocínio básico do fluxo de custos no PEPS.", "dica": "🎯 PEPS: sai antigo, fica recente.", "pegadinha": "⚠️ Método de custo, não necessariamente fluxo físico real."}, {"pergunta": "No custo médio, cada nova compra pode alterar o custo unitário?", "resposta": "Sim, especialmente no custo médio móvel.", "explicacao": "A média é recalculada conforme novas entradas ocorrem.", "dica": "🎯 Nova entrada muda a média.", "pegadinha": "⚠️ No periódico, a média é calculada ao fim do período."}, {"pergunta": "O custo específico é adequado para itens intercambiáveis em massa?", "resposta": "Não. Para itens comuns e intercambiáveis, normalmente usa-se PEPS ou média ponderada.", "explicacao": "Identificação específica é para itens individualizados.", "dica": "🎯 Item comum = PEPS ou média.", "pegadinha": "⚠️ Não aplique custo específico indevidamente."}, {"pergunta": "Estoque recebido em compra deve incluir impostos de importação não recuperáveis?", "resposta": "Sim. Imposto de importação e tributos não recuperáveis compõem o custo.", "explicacao": "São gastos necessários para adquirir e disponibilizar o estoque.", "dica": "🎯 Importação não recuperável entra no custo.", "pegadinha": "⚠️ Recuperável fica fora."}, {"pergunta": "Custos de manuseio diretamente ligados à compra podem integrar estoque?", "resposta": "Sim, se necessários para colocar o estoque no local e condição atuais.", "explicacao": "Manuseio, transporte e outros gastos diretamente atribuíveis podem ser capitalizados.", "dica": "🎯 Necessário e direto = pode integrar.", "pegadinha": "⚠️ Manuseio administrativo geral não entra."}, {"pergunta": "Salários da equipe de vendas integram o estoque?", "resposta": "Não. São despesas de venda.", "explicacao": "Não são necessários para produzir ou trazer o estoque à condição e localização atuais.", "dica": "🎯 Vendedor = despesa de venda.", "pegadinha": "⚠️ Não confunda com mão de obra direta de produção."}, {"pergunta": "Mão de obra direta de produção integra o custo dos estoques?", "resposta": "Sim. Integra o custo de transformação.", "explicacao": "É diretamente atribuível às unidades produzidas.", "dica": "🎯 MOD entra no produto.", "pegadinha": "⚠️ Mão de obra administrativa não entra."}, {"pergunta": "Depreciação de máquinas produtivas pode integrar o estoque?", "resposta": "Sim, por meio dos custos indiretos de fabricação alocados.", "explicacao": "A depreciação da fábrica é custo de produção, desde que relacionada à fabricação.", "dica": "🎯 Depreciação fabril pode compor CIF.", "pegadinha": "⚠️ Depreciação do setor administrativo é despesa."}, {"pergunta": "Depreciação do prédio administrativo integra o estoque?", "resposta": "Não, normalmente é despesa administrativa.", "explicacao": "Não está diretamente relacionada à transformação dos estoques.", "dica": "🎯 Administração geral não compõe estoque.", "pegadinha": "⚠️ Fábrica e administração têm tratamentos diferentes."}, {"pergunta": "Em prova, “menor entre custo e mercado” é sempre tecnicamente preciso?", "resposta": "Não. O CPC 16 fala em menor entre custo e valor realizável líquido.", "explicacao": "Algumas bancas usam linguagem antiga, mas o termo correto é VRL.", "dica": "🎯 Termo técnico: valor realizável líquido.", "pegadinha": "⚠️ Cuidado com “mercado” sem detalhamento."}, {"pergunta": "Se o preço de venda é R$ 100 e gastos de venda são R$ 10, o VRL é R$ 90?", "resposta": "Sim, se não houver custos adicionais de conclusão.", "explicacao": "VRL = preço de venda estimado menos gastos necessários para vender e concluir.", "dica": "🎯 100 – 10 = 90.", "pegadinha": "⚠️ Se houver custos para concluir, também deduza."}, {"pergunta": "Se o custo é R$ 120 e o VRL é R$ 100, o estoque deve ficar por R$ 120?", "resposta": "Não. Deve ser ajustado para R$ 100.", "explicacao": "A perda de R$ 20 deve ser reconhecida no resultado.", "dica": "🎯 Estoque fica pelo menor valor.", "pegadinha": "⚠️ Não mantenha custo acima do VRL."}, {"pergunta": "Se o custo é R$ 80 e o VRL é R$ 100, o estoque deve ser aumentado para R$ 100?", "resposta": "Não. Permanece pelo custo de R$ 80.", "explicacao": "A regra é o menor valor entre custo e VRL.", "dica": "🎯 Menor valor: R$ 80.", "pegadinha": "⚠️ Não reconheça ganho antes da venda."}, {"pergunta": "A reversão de perda pode ultrapassar o custo original?", "resposta": "Não. A reversão é limitada ao valor anteriormente reduzido.", "explicacao": "O estoque não deve ser mensurado acima do custo que teria sido registrado.", "dica": "🎯 Reverte até o limite do custo.", "pegadinha": "⚠️ Reversão não cria ganho além do custo."}, {"pergunta": "A baixa de estoque vendido deve acompanhar a competência?", "resposta": "Sim. O custo deve ser reconhecido no mesmo período da receita relacionada.", "explicacao": "Isso respeita a confrontação entre receitas e despesas.", "dica": "🎯 Receita da venda e CMV no mesmo período.", "pegadinha": "⚠️ Não empurre CMV para outro período."}, {"pergunta": "Itens comprados para distribuição gratuita podem ser estoque?", "resposta": "Podem ser ativos enquanto controlados, mas a finalidade e norma aplicável devem ser analisadas.", "explicacao": "Em entidades públicas ou sem fins lucrativos, pode haver tratamento específico. Para CPC 16, foco é venda ou consumo no processo.", "dica": "🎯 Analise finalidade do item.", "pegadinha": "⚠️ Cuidado com setor público e normas específicas."}, {"pergunta": "No CPC 16, estoque é sempre bem tangível?", "resposta": "Em regra envolve bens e materiais, mas serviços em andamento também podem gerar custos classificados como estoques.", "explicacao": "A ideia central é ativo ligado à venda, produção ou prestação ainda não reconhecida como receita.", "dica": "🎯 Não limite mentalmente a mercadorias.", "pegadinha": "⚠️ Serviços podem ter estoque de custos."}, {"pergunta": "A FGV costuma cobrar quais pegadinhas no CPC 16?", "resposta": "Menor entre custo e VRL, tributos recuperáveis, frete de compra/venda, descontos comerciais/financeiros e UEPS proibido.", "explicacao": "Esses pontos aparecem muito porque exigem classificação precisa.", "dica": "🎯 Revise esses cinco blocos antes da prova.", "pegadinha": "⚠️ Erro comum: colocar tudo no estoque."}, {"pergunta": "Na compra para revenda, ICMS recuperável entra no estoque?", "resposta": "Não. Deve ser registrado em conta de tributos a recuperar.", "explicacao": "O estoque fica líquido do tributo recuperável.", "dica": "🎯 ICMS recuperável fora do estoque.", "pegadinha": "⚠️ ICMS não recuperável entra."}, {"pergunta": "IPI não recuperável para empresa comercial pode entrar no custo?", "resposta": "Sim. Quando não recuperável, compõe o custo de aquisição.", "explicacao": "Para empresa comercial, o IPI frequentemente é tratado como custo quando não recuperável.", "dica": "🎯 IPI não recuperável entra.", "pegadinha": "⚠️ Verifique o enunciado: recuperável ou não?"}, {"pergunta": "O custo do estoque inclui todos os gastos da empresa no período?", "resposta": "Não. Apenas gastos relacionados à aquisição, transformação e condição/localização atuais dos estoques.", "explicacao": "Gastos gerais sem relação direta são despesas.", "dica": "🎯 Só entra o necessário ao estoque.", "pegadinha": "⚠️ “Todos os gastos” é expressão perigosa."}, {"pergunta": "CPC 16 é tema importante para CFC e concursos?", "resposta": "Sim. É recorrente em questões de contabilidade geral, custos, CPCs e demonstrações contábeis.", "explicacao": "As bancas exploram conceitos e pequenos cálculos.", "dica": "🎯 Domine CPC 16 para ganhar pontos rápidos.", "pegadinha": "⚠️ Questões parecem simples, mas têm pegadinhas."}];
let atual = 0;

function carregar(){
  const f = flashcards[atual];
  document.getElementById('pergunta').innerHTML = f.pergunta;
  document.getElementById('resposta').innerHTML = `
    <div class="bloco"><strong>Resposta:</strong><br>${f.resposta}</div>
    <div class="bloco"><strong>Explicação:</strong><br>${f.explicacao}</div>
    <div class="bloco"><strong>Dica:</strong><br>${f.dica}</div>
    <div class="bloco"><strong>Pegadinha:</strong><br>${f.pegadinha}</div>
  `;
  document.getElementById('contador').innerHTML = `Cartão ${atual+1} de ${flashcards.length}`;
  document.getElementById('barra').style.width = ((atual+1)/flashcards.length*100) + '%';
  document.getElementById('card').classList.remove('virado');
}
function virarCard(){document.getElementById('card').classList.toggle('virado');}
function proximo(){if(atual < flashcards.length-1){atual++; carregar();}}

carregar();
</script>
